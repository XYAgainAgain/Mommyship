[project]

site_name = "Mommyship"
site_description = "A Homebrew Ruleset for the Mothership Sci-Fi Horror RPG"
site_url = "https://mommyship.mom/"

extra_css = ["stylesheets/extra.css", "stylesheets/osminok.css"]
extra_javascript = ["javascripts/extra.js", "javascripts/osminok.js"]

nav = [
  { "Home" = "index.md" },
  { "Player's Survival Guide" = [
    "players-survival-guide/index.md",
    { "Making Your Character" = "players-survival-guide/making-your-character.md" },
    { "How to Play" = "players-survival-guide/how-to-play.md" },
    { "Civilization" = "players-survival-guide/civilization.md" },
    { "Gear" = "players-survival-guide/gear.md" },
    { "Quick Guide" = "players-survival-guide/quick-guide.md" },
  ] },
  { "Shipbreaker's Toolkit" = [
    "shipbreakers-toolkit/index.md",
    { "Ships & Space Travel" = "shipbreakers-toolkit/ships-and-space-travel.md" },
    { "Space Travel" = "shipbreakers-toolkit/space-travel.md" },
    { "Operating Costs" = "shipbreakers-toolkit/operating-costs.md" },
    { "Ship Quick Guide" = "shipbreakers-toolkit/ship-quick-guide.md" },
  ] },
  { "D.A.V.E. Pilot Manual" = "dave-pilot-manual.md" },
]

# variant "classic" keeps the Material for MkDocs look; "modern" is a separate deferred task.
[project.theme]
variant = "classic"
custom_dir = "overrides"
favicon = "assets/favicon.png"
features = [
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tracking",
  "navigation.sections",
  "navigation.top",
  "navigation.indexes",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "search.share",
  "content.tooltips",
]

[project.theme.icon]
logo = "material/rocket-launch"

# primary/accent "custom" hand color control to extra.css (--md-primary-fg-color etc.)
[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-night"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to dark mode (AKA correct mode)"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.def_list]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.critic]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.snippets]
auto_append = ["includes/abbreviations.md"]
[project.markdown_extensions.toc]
permalink = true
title = "Table of Contents"

[project.markdown_extensions.zensical.extensions.glightbox]
skip_classes = ["off-glb"]
