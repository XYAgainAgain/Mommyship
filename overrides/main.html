{% extends "base.html" %}

{#- Warp background: importmap must precede the module script that imports three -#}
{% block extrahead %}
  <script type="importmap">
  {
    "imports": {
      "three":        "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.webgpu.js",
      "three/tsl":    "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.tsl.js"
    }
  }
  </script>
  <script type="module">
    /* Phones chug on the warp renderer: skip the module entirely. 600 = Android's
       phone/tablet dp cutoff; the html class survives navigation.instant body morphs. */
    const phone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600;
    if (phone) document.documentElement.classList.add('no-warp');
    else import("{{ 'javascripts/warp-bg.js' | url }}");
  </script>
{% endblock %}
